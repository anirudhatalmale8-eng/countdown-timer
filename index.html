<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown Timer</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #262b36;
    --text: #e8ebf0;
    --muted: #8b93a5;
    --accent: #4ade80;
    --warn: #fbbf24;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1b2030 0%, var(--bg) 60%);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px 28px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    text-align: center;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: 13px; }

  .display {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    font-size: 64px;
    font-weight: 600;
    letter-spacing: .02em;
    line-height: 1.1;
    margin: 8px 0 4px;
    transition: color .2s ease;
  }
  .display.warn { color: var(--warn); }
  .display.danger { color: var(--danger); }
  .display.done { color: var(--accent); }

  .status {
    min-height: 20px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .bar {
    height: 6px;
    width: 100%;
    background: #22273180;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .bar > span {
    display: block;
    height: 100%;
    width: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width .2s linear, background-color .2s ease;
  }

  .setter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  label { font-size: 13px; color: var(--muted); }
  input[type="number"] {
    width: 96px;
    padding: 10px 12px;
    font-size: 15px;
    text-align: center;
    color: var(--text);
    background: #11141a;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
  }
  input[type="number"]:focus { border-color: var(--accent); }
  input[type="number"]:disabled { opacity: .5; cursor: not-allowed; }

  .presets { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; flex-wrap: wrap; }
  .presets button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  .presets button:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
  .presets button:disabled { opacity: .4; cursor: not-allowed; }

  .controls { display: flex; gap: 10px; }
  .controls button {
    flex: 1;
    padding: 13px 10px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: #1e222b;
    color: var(--text);
    cursor: pointer;
    transition: transform .06s ease, background-color .15s ease;
  }
  .controls button:hover:not(:disabled) { background: #252a35; }
  .controls button:active:not(:disabled) { transform: translateY(1px); }
  .controls button:disabled { opacity: .4; cursor: not-allowed; }
  #startBtn { background: var(--accent); border-color: var(--accent); color: #05240f; }
  #startBtn:hover:not(:disabled) { background: #6ee79a; }

  .hint { margin: 18px 0 0; font-size: 11px; color: #5f6678; }
  kbd {
    background: #11141a; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 5px; font-size: 10px; font-family: inherit;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Countdown Timer</h1>
    <p class="sub">Set the minutes, then start.</p>

    <div class="display" id="display">05:00</div>
    <div class="status" id="status">Ready</div>

    <div class="bar"><span id="progress"></span></div>

    <div class="setter">
      <label for="minutes">Minutes</label>
      <input type="number" id="minutes" min="0" max="999" step="1" value="5" inputmode="numeric">
    </div>

    <div class="presets" id="presets">
      <button type="button" data-min="1">1 min</button>
      <button type="button" data-min="5">5 min</button>
      <button type="button" data-min="10">10 min</button>
      <button type="button" data-min="25">25 min</button>
    </div>

    <div class="controls">
      <button type="button" id="startBtn">Start</button>
      <button type="button" id="pauseBtn" disabled>Pause</button>
      <button type="button" id="resetBtn">Reset</button>
    </div>

    <p class="hint"><kbd>Space</kbd> start / pause &nbsp;·&nbsp; <kbd>R</kbd> reset</p>
  </main>

<script>
(function () {
  "use strict";

  var display  = document.getElementById("display");
  var statusEl = document.getElementById("status");
  var progress = document.getElementById("progress");
  var minutesInput = document.getElementById("minutes");
  var startBtn = document.getElementById("startBtn");
  var pauseBtn = document.getElementById("pauseBtn");
  var resetBtn = document.getElementById("resetBtn");
  var presets  = document.getElementById("presets");

  var totalMs = 5 * 60 * 1000; // duration of the current countdown
  var remainingMs = totalMs;   // what's left when paused / stopped
  var deadline = 0;            // wall-clock ms at which we hit zero
  var ticker = null;
  var running = false;

  function readMinutes() {
    var v = parseFloat(minutesInput.value);
    if (!isFinite(v) || v < 0) v = 0;
    if (v > 999) v = 999;
    return v;
  }

  function format(ms) {
    if (ms < 0) ms = 0;
    var totalSec = Math.ceil(ms / 1000);
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    var pad = function (n) { return n < 10 ? "0" + n : String(n); };
    return h > 0 ? pad(h) + ":" + pad(m) + ":" + pad(s) : pad(m) + ":" + pad(s);
  }

  function render(ms) {
    display.textContent = format(ms);
    document.title = (running ? "▶ " : "") + format(ms) + " — Countdown Timer";

    var pct = totalMs > 0 ? Math.max(0, Math.min(1, ms / totalMs)) : 0;
    progress.style.width = (pct * 100).toFixed(2) + "%";

    display.classList.remove("warn", "danger", "done");
    if (ms <= 0) {
      display.classList.add("done");
      progress.style.backgroundColor = "var(--accent)";
    } else if (ms <= 10000) {
      display.classList.add("danger");
      progress.style.backgroundColor = "var(--danger)";
    } else if (ms <= 60000) {
      display.classList.add("warn");
      progress.style.backgroundColor = "var(--warn)";
    } else {
      progress.style.backgroundColor = "var(--accent)";
    }
  }

  function setControls(state) {
    // state: "ready" | "running" | "paused" | "done"
    running = (state === "running");
    var locked = (state === "running" || state === "paused");

    minutesInput.disabled = locked;
    Array.prototype.forEach.call(presets.querySelectorAll("button"), function (b) {
      b.disabled = locked;
    });

    startBtn.disabled = (state === "running" || state === "done");
    pauseBtn.disabled = (state !== "running");
    startBtn.textContent = (state === "paused") ? "Resume" : "Start";

    statusEl.textContent = {
      ready:   "Ready",
      running: "Running",
      paused:  "Paused",
      done:    "Time's up"
    }[state];
  }

  function stopTicker() {
    if (ticker !== null) {
      clearInterval(ticker);
      ticker = null;
    }
  }

  function tick() {
    remainingMs = deadline - Date.now();
    if (remainingMs <= 0) {
      remainingMs = 0;
      stopTicker();
      setControls("done");
      render(0);
      flash();
      beep();
      return;
    }
    render(remainingMs);
  }

  function start() {
    if (running) return;

    // Fresh start (not a resume): take the duration from the input.
    if (remainingMs <= 0 || statusEl.textContent === "Ready") {
      totalMs = Math.round(readMinutes() * 60 * 1000);
      remainingMs = totalMs;
    }
    if (remainingMs <= 0) return; // nothing to count down

    deadline = Date.now() + remainingMs;
    setControls("running");
    render(remainingMs);
    stopTicker();
    ticker = setInterval(tick, 100); // 100ms keeps the seconds flip crisp
  }

  function pause() {
    if (!running) return;
    stopTicker();
    remainingMs = Math.max(0, deadline - Date.now());
    setControls("paused");
    render(remainingMs);
  }

  function reset() {
    stopTicker();
    totalMs = Math.round(readMinutes() * 60 * 1000);
    remainingMs = totalMs;
    setControls("ready");
    render(remainingMs);
  }

  function flash() {
    var n = 0;
    var id = setInterval(function () {
      display.style.visibility = (display.style.visibility === "hidden") ? "visible" : "hidden";
      if (++n >= 8) { clearInterval(id); display.style.visibility = "visible"; }
    }, 250);
  }

  function beep() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.9);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 1);
    } catch (e) { /* audio is a nicety, never a blocker */ }
  }

  startBtn.addEventListener("click", start);
  pauseBtn.addEventListener("click", pause);
  resetBtn.addEventListener("click", reset);

  minutesInput.addEventListener("input", function () {
    if (!running && statusEl.textContent !== "Paused") reset();
  });

  presets.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-min]");
    if (!btn || btn.disabled) return;
    minutesInput.value = btn.getAttribute("data-min");
    reset();
  });

  document.addEventListener("keydown", function (e) {
    if (e.target === minutesInput) return;
    if (e.code === "Space") {
      e.preventDefault();
      running ? pause() : start();
    } else if (e.key === "r" || e.key === "R") {
      reset();
    }
  });

  render(remainingMs);
  setControls("ready");
})();
</script>
</body>
</html>
